# Packaging (PIANO.md Fase 5) + config strumenti di sviluppo. Nessuna dipendenza runtime: il core
# resta stdlib. Il layout del repo è quello del plugin Claude Code; il pacchetto pip mappa le stesse
# cartelle senza spostare file:  anja ← scripts/anja  ·  anja_scripts ← scripts (moduli CLI condivisi).
#   pipx install git+https://github.com/vincent-vigorito/anjadev   →  anja-memory-server, anja-code-server

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anjadev"
dynamic = ["version"]
description = "anja: wiki self-maintained + memoria identitaria + ricerca semantica del codice, come server MCP stdio per qualunque host (Claude Code, Codex, OpenCode, Grok)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Vincent Vigorito", email = "vvigorito@vigesrl.it"}]
keywords = ["mcp", "wiki", "knowledge-base", "memory", "code-search", "semantic-search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.6", "httpx>=0.27"]
dev = ["pytest", "ruff", "coverage", "sqlite-vec", "httpx"]

[project.scripts]
anja-memory-server = "anja.server:main"
anja-code-server = "anja_scripts.mcp_code_server:main"

[project.urls]
Homepage = "https://github.com/vincent-vigorito/anjadev"
Changelog = "https://github.com/vincent-vigorito/anjadev/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["anja", "anja_scripts"]
package-dir = {anja = "scripts/anja", anja_scripts = "scripts"}

[tool.setuptools.dynamic]
version = {attr = "anja.config.SERVER_VERSION"}


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = ["plugins", ".opencode", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Ignorati per partire con la CI verde su 13k righe esistenti; da sciogliere a ogni release.
extend-ignore = [
    "E501",  # line-too-long: 317 casi (description dei tool, regex). TODO 2026-09: sciogliere per modulo
    "E702",  # multiple-statements-on-one-line: 50 casi nei test in stile script. TODO 2026-09
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_memory_server", "code_db", "code_index", "code_search", "embed_providers",
                     "roadmap_io", "wiki_embed", "graph_report", "graph_html", "skill_parser",
                     "context_loader", "lint_checks", "slugify", "secrets_loader", "steward",
                     "compact_sessions", "journal_policy", "gen_tools_doc"]

[tool.coverage.run]
# ${ANJA_COV_ROOT} è impostato da tests/_coverage_hook/sitecustomize.py (sottoprocessi con cwd arbitrario)
source = ["${ANJA_COV_ROOT}/scripts", "${ANJA_COV_ROOT}/hooks"]
parallel = true
branch = false
omit = ["scripts/migrate_cc_memory.py", "scripts/cc_memory_to_soul.py", "scripts/cc_memory_sync.py"]

[tool.coverage.report]
skip_covered = false
show_missing = false
precision = 1
